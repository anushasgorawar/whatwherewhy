apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-observer-backend
  namespace: pod-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-observer-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-observer-read-binding
subjects:
  - kind: ServiceAccount
    name: pod-observer-backend
    namespace: pod-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-observer-read
