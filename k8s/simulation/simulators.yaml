apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-simulator
  namespace: simulation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: readiness-simulator
  template:
    metadata:
      labels:
        app: readiness-simulator
    spec:
      containers:
        - name: simulator
          image: python:3.11-alpine
          command: ["python", "/opt/sim/simulator.py"]
          env:
            - name: SERVICE_NAME
              value: readiness-simulator
            - name: SCENARIO
              value: readiness
            - name: READINESS_FAIL
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: scripts
              mountPath: /opt/sim
      volumes:
        - name: scripts
          configMap:
            name: simulator-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-simulator
  namespace: simulation
spec:
  selector:
    app: readiness-simulator
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-simulator-settings
  namespace: simulation
data:
  APP_MODE: broken
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-simulator
  namespace: simulation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: config-simulator
  template:
    metadata:
      labels:
        app: config-simulator
    spec:
      containers:
        - name: simulator
          image: python:3.11-alpine
          command: ["python", "/opt/sim/simulator.py"]
          env:
            - name: SERVICE_NAME
              value: config-simulator
            - name: SCENARIO
              value: config
            - name: CONFIG_MODE
              valueFrom:
                configMapKeyRef:
                  name: config-simulator-settings
                  key: APP_MODE
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: scripts
              mountPath: /opt/sim
      volumes:
        - name: scripts
          configMap:
            name: simulator-scripts
