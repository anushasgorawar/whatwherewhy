apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-simulator
  namespace: simulation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: crashloop-simulator
  template:
    metadata:
      labels:
        app: crashloop-simulator
    spec:
      containers:
        - name: simulator
          image: python:3.11-alpine
          command: ["python", "/opt/sim/simulator.py"]
          env:
            - name: SERVICE_NAME
              value: crashloop-simulator
            - name: SCENARIO
              value: crashloop
            - name: FAIL_MODE
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: scripts
              mountPath: /opt/sim
      volumes:
        - name: scripts
          configMap:
            name: simulator-scripts
---
